<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Venue Ticketing System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Grand Theatre</h1>
        <p>Choose your seats. Enjoy the show.</p>
    </header>
<main>
    <section class="venue-section">
        <h2>Venue Map</h2>
        <p class="intro">
            Select a seat to view its details and ticket price.
        </p>
        <div class="seat-legend">
            <div class="legend-item">
                <span class="legend-seat available-legend"></span>
                <span>Available</span>
            </div>
        
            <div class="legend-item">
                <span class="legend-seat unavailable-legend"></span>
                <span>Unavailable</span>
            </div>
        
            <div class="legend-item">
                <span class="legend-seat selected-legend"></span>
                <span>Selected</span>
            </div>

            <div class="legend-item">
                <span class="legend-seat in-cart-legend"></span>
                <span>In Cart</span>
            </div>
        </div>
        <div class="map-viewport">
            <div id="venue-map">
                <p>The venue map will appear here.</p>
            </div>
        
            <div class="map-controls" aria-label="Venue map controls">
                <div class="pan-controls">
                    <button type="button" id="move-up" class="up" aria-label="Move up">↑</button>
                    <button type="button" id="move-left" class="left" aria-label="Move left">←</button>
                    <button type="button" id="reset-view" class="reset" aria-label="Reset view">⟲</button>
                    <button type="button" id="move-right" class="right" aria-label="Move right">→</button>
                    <button type="button" id="move-down" class="down" aria-label="Move down">↓</button>
                </div>
                <div class="zoom-controls">
                    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
                    <output id="zoom-level" aria-live="polite">100%</output>
                    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
                </div>
            </div>
        </div>
    </section>
    <section class="seat-details">
        <h2>Seat Details</h2>
        <p id="seat-message">Select a seat to see its details.</p>
        <div id="seat-info"></div>
        <button id="add-to-cart" disabled>Add to Cart</button>
    </section>
    <section class="cart-section">
        <h2>Your Cart</h2>
        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>
        <p id="cart-total">Total: 0.00 AZN</p>
    </section>
</main>
</body>
</html>
