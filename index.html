<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Venue Ticketing System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Grand Theatre</h1>
        <p>Choose your seats. Enjoy the show.</p>
    </header>
<main>
    <section class="venue-section">
        <h2>Venue Map</h2>
        <p class="intro">
            Select a seat to view its details and ticket price.
        </p>
        <div id="venue-map">
            <p>The venue map will appear here.</p>
        </div>
    </section>
    <section class="seat-details">
        <h2>Seat Details</h2>
        <p id="seat-message">Select a seat to see its details.</p>
        <div id="seat-info"></div>
        <button id="add-to-cart" disabled>Add to Cart</button>
    </section>
    <section class="cart-section">
        <h2>Your Cart</h2>
        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>
        <p id="cart-total">Total: 0.00 AZN</p>
    </section>
</main>
</body>
</html>
